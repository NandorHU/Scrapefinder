plugins { id 'com.android.application' }

android {
    namespace 'hu.dealhunter.app'
    compileSdk 35

    defaultConfig {
        applicationId 'hu.dealhunter.app'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.10.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
}

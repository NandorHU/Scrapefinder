name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrapefinder-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: scrapefinder-debug-signing-v1

      - name: Verify stable signing key
        shell: bash
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "ERROR: Stable Scrapefinder signing key is missing. Refusing to generate a new key because that would break APK updates." >&2
            exit 1
          fi
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep -E "SHA256:|Owner:" || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -1 | sed -E "s/.*versionName[[:space:]]+'([^']+)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "Scrapefinder-$VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scrapefinder-${{ steps.version.outputs.version }}-apk
          path: Scrapefinder-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "Scrapefinder-$VERSION.apk" \
            --title "Scrapefinder $TAG" \
            --notes "Automatikus Scrapefinder build. Az alkalmazás Frissítés keresése gombja ezt a kiadást használja."

name: Poké Battle Lens APK
on:
  workflow_dispatch:
  push:
    branches: [poke-battle-lens]
    paths: ['poke-battle-lens/**', '.github/workflows/poke-battle-lens.yml']
  pull_request:
    paths: ['poke-battle-lens/**', '.github/workflows/poke-battle-lens.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poke-battle-lens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: OCR, Pokemon switch and region editor device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: poke-battle-lens
          emulator-boot-timeout: 300
          script: |
            adb install -r touch-fixture/build/outputs/apk/debug/touch-fixture-debug.apk
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb pull /data/local/tmp/badges-preview.png app/build/reports/androidTests/badges-preview.png
            adb pull /data/local/tmp/overlay-preview.png app/build/reports/androidTests/overlay-preview.png
            adb pull /data/local/tmp/editor-preview.png app/build/reports/androidTests/editor-preview.png
            python3 -c "import base64,pathlib; print('::group::Synthetic editor preview'); print('EDITOR_PREVIEW_BASE64='+base64.b64encode(pathlib.Path('app/build/reports/androidTests/editor-preview.png').read_bytes()).decode()); print('::endgroup::')"
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk poke-battle-lens-0.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: poke-battle-lens-0.3.0
          path: poke-battle-lens/poke-battle-lens-0.3.0.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            poke-battle-lens/app/build/reports/androidTests
            poke-battle-lens/app/build/reports/tests
            poke-battle-lens/app/build/reports/lint-results-debug.html

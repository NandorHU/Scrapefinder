name: Poké Battle Lens APK
on:
  workflow_dispatch:
  push:
    branches: [poke-battle-lens]
    paths: ['poke-battle-lens/**', '.github/workflows/poke-battle-lens.yml']
  pull_request:
    paths: ['poke-battle-lens/**', '.github/workflows/poke-battle-lens.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poke-battle-lens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk poke-battle-lens-0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: poke-battle-lens-0.1.0
          path: poke-battle-lens/poke-battle-lens-0.1.0.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            poke-battle-lens/app/build/reports/tests
            poke-battle-lens/app/build/reports/lint-results-debug.html
